server:
  servlet:
    encoding:
      charset: UTF-8
      force: true
  port: 8899

spring:
  application:
    name: springai-recruit-agent

  # 激活本地配置（application-local.yml 含真实密钥，不入库）
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}
      chat:
        options:
          model: qwen-plus
          temperature: 0.7


  pgvector:
    datasource:
      url: jdbc:postgresql://${PGVECTOR_HOST:localhost}:5432/recruit_vector
      username: ${PGVECTOR_USER:postgres}
      password: ${PGVECTOR_PASSWORD:postgres}
      driver-class-name: org.postgresql.Driver


  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/recruit?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    # ★ 第 7 步新增：HikariCP 连接池调优
    hikari:
      pool-name: mysql-pool
      maximum-pool-size: 20          # 最大连接数
      minimum-idle: 5                # 最小空闲连接
      connection-timeout: 5000       # 获取连接超时（毫秒）
      idle-timeout: 600000           # 空闲连接回收时间（毫秒，10 分钟）
      max-lifetime: 1800000          # 连接最长生命周期（毫秒，30 分钟）


  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql


  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      password: ${REDIS_PASSWORD:123}
      timeout: 3000ms


mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

# ============ API 文档 ============
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

knife4j:
  enable: true
  setting:
    language: zh_cn
